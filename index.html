<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Питание</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Питание">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f9">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="plate-icon-180.png">
<style>
:root{
  --bg:#f3f5f9;--card:#fff;--ink:#17202e;--muted:#667187;--line:#e1e6ee;
  --accent:#4a56d8;--accent-soft:#e8eafb;--on-accent:#fff;
  --part:#c98a1b;--part-soft:#fbf0d9;--danger:#b4412f;
  --prot:#2f6b5a;--fat:#c98a1b;--carb:#3f6fb5;--kcal:#17202e;--track:#e6e9f0;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(6px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-height:30px;padding:0 12px;border-radius:15px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.day[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
h1{font-size:21px;line-height:1.2;margin:14px 0 2px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.sum{padding:14px 16px;margin-bottom:16px}
.kcal{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.kcal b{font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kcal span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;transition:width .2s}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.macro small{display:block;color:var(--muted);font-size:13px}
.macro b{display:block;font-size:17px;font-variant-numeric:tabular-nums;margin-bottom:5px}
.macro b em{font-style:normal;font-weight:400;font-size:13px;color:var(--muted)}
.fiber{color:var(--muted);font-size:13px;margin-top:12px}
.meal{margin-bottom:14px;overflow:hidden}
.mealhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 16px 8px}
.mealhead h2{font-size:17px;margin:0}
.mealhead span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px 8px 12px}
.tick{flex:0 0 44px;height:44px;display:grid;place-items:center}
.tick i{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;color:var(--on-accent);font-style:normal;font-size:16px;font-weight:700}
.item.full .tick i{background:var(--accent);border-color:var(--accent)}
.item.part .tick i{border-color:var(--part);background:linear-gradient(90deg,var(--part) 50%,transparent 50%)}
.info{flex:1;min-width:0;text-align:left;display:block;min-height:44px;padding:2px 0}
.info b{display:block;font-weight:500;overflow-wrap:anywhere}
.item.full .info b{color:var(--muted)}
.info small{display:block;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.item.part .info small.st{color:var(--part);font-weight:600}
.edit{padding:0 16px 14px 68px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:22px;font-weight:600}
.step input{width:84px;height:44px;text-align:center;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums}
.step span{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);font-size:14px}
.actions{display:grid;gap:10px;margin:18px 0 8px}
.btn{min-height:48px;border-radius:14px;font-weight:600;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);font-weight:500}
nav{display:flex;gap:2px;padding:2px;margin-bottom:6px;background:var(--track);border-radius:10px}
nav button{flex:1 1 0;min-width:0;min-height:32px;border-radius:8px;font-weight:600;color:var(--muted);font-size:13.5px;white-space:nowrap}
nav button[aria-current=page]{background:var(--card);color:var(--accent);box-shadow:0 1px 2px rgba(23,32,46,.12)}
.shop{display:flex;align-items:center;gap:12px;min-height:60px;width:100%;padding:8px 16px 8px 12px;border-top:1px solid var(--line);text-align:left}
.shop:first-child{border-top:0}
.shop .amt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.shop.done{color:var(--muted)}
.shop.done .tick i{background:var(--accent);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
textarea.copy{width:100%;height:220px;margin-top:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px;font-size:16px}
.ck{color:var(--accent)!important;font-weight:600}
.ckrow{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:14px}
.ckrow input,.field input,.field select{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;padding:0 10px;font-variant-numeric:tabular-nums}
.ckrow input{width:84px;text-align:center}
.cook{padding:14px 16px;margin-bottom:14px}
.cook h2{font-size:17px;margin:0 0 10px}
.field{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:15px}
.field>span:first-child{flex:1;min-width:0}
.field input{width:92px;text-align:center}
.field.col{display:block}
.field.col span{display:block;margin-bottom:6px}
.field.col input,.field.col select{width:100%;text-align:left}
details{margin-bottom:6px}
summary{min-height:44px;display:flex;align-items:center;color:var(--accent);font-weight:600;cursor:pointer}
.btn.small{width:100%;min-height:44px;font-size:15px;margin-top:4px}
.vessel{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid var(--line);margin-bottom:10px}
.vessel span{flex:1;min-width:0;overflow-wrap:anywhere}
.vessel button{min-height:44px;color:var(--danger);font-size:14px}
body.locked{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.sheetbox{width:100%;max-width:560px;margin:0 auto;height:86vh;height:86dvh;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sheethead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheethead h2{font-size:17px;margin:0;min-width:0;overflow-wrap:anywhere}
.sheethead button{min-height:44px;color:var(--accent);font-weight:600;flex:0 0 auto}
.sheetbody{flex:1;overflow-y:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.sheetbody h3{margin:4px 0 12px;font-size:17px}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:16px;margin-bottom:10px}
.pick{display:block;width:100%;text-align:left;padding:10px 0;min-height:56px;border-bottom:1px solid var(--line)}
.pick b{display:block;font-weight:500}
.pick em{font-style:normal;font-size:12px;color:var(--part)}
.pick small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 input{padding:0 4px;text-align:center}
.xrow{padding-left:16px}
.del{min-height:44px;color:var(--danger);font-size:14px;flex:0 0 auto}
.vthumb{flex:0 0 48px;height:48px;border-radius:10px;overflow:hidden;background:var(--track);display:grid;place-items:center;cursor:pointer}
.vthumb img,.vp img{width:100%;height:100%;object-fit:cover;display:block}
.vthumb i{font-style:normal;font-size:11px;color:var(--muted)}
.vpick{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.vp{flex:0 0 84px;min-height:60px;border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.vp.on{border-color:var(--accent)}
.vp img{width:68px;height:68px;border-radius:8px;display:block;margin:0 auto 4px}
.vp small{display:block;font-size:11px;line-height:1.25;overflow-wrap:anywhere}
.webbtn{margin:0 0 8px}
.webhead{margin:6px 0 2px}
.wcard{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap}
.wcard .step{margin:0}
.wsave{min-height:44px;padding:0 16px;border-radius:12px;background:var(--accent);color:var(--on-accent);font-weight:600}
.trhint{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;margin-bottom:12px;background:var(--accent-soft)}
.trhint button{min-height:40px;font-weight:600;white-space:nowrap}
.trnav{display:flex;gap:8px;margin-bottom:12px}
.trnav .btn{flex:1;margin:0}
.trex{padding:12px 14px;margin-bottom:12px}
.trex h2{margin:0 0 8px;font-size:17px}
.trlines{display:flex;flex-wrap:wrap;gap:6px}
.trlines span{background:var(--accent-soft);border-radius:8px;padding:4px 10px;font-weight:600;font-variant-numeric:tabular-nums}
.trnote{display:block;margin-top:6px;color:var(--muted);font-size:13px}
.trwarn{font-size:14px;margin:8px 0}
.trwarm{margin-top:10px}
.trwarm small{color:var(--muted);font-size:13px}
.trwarm ol{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:4px 0 0;padding:0}
.trwarm li{border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:14px;font-variant-numeric:tabular-nums}
.syncbar { margin: 0 0 6px; font-size: 13px; opacity: .7; }
.next .nextrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); }
.next .nextrow:last-child { padding-bottom: 14px; }
.next .nextrow span { min-width: 0; overflow-wrap: anywhere; }
.next .nextrow b { white-space: nowrap; }
.cmode{margin:0 0 10px}
.cmode button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.xrow .info{background:none;border:0;padding:0;text-align:left;cursor:pointer}
</style>
</head>
<body>
<header><div class="wrap"><nav aria-label="Разделы">
  <button id="tabPlan" type="button">Рацион</button>
  <button id="tabTrain" type="button">Тренировка</button>
  <button id="tabGrams" type="button">Граммовки</button>
  <button id="tabShop" type="button">Покупки</button>
</nav><div class="days" id="days" role="tablist" aria-label="Дни плана"></div></div></header>
<main class="wrap" id="main"></main>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status"></div>
<script src="plan.js"></script>
<script src="products.js"></script>
<script src="training.js"></script>
<script src="app.js"></script>
<script src="train.js"></script>
<script src="sync.js"></script>
</body>
</html>
